<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3c4b44">
  <title>Mindat Nearby</title>
  <link rel="icon" href="favicon.png">
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=20261020b">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Cassettiera">
      <div class="rail-brand">
        <span class="brand-name">Mindat</span>
        <span class="brand-sub">Nearby</span>
      </div>
      <div class="rail-main">
        <button class="drawer" data-view="nearby" type="button"></button>
        <button class="drawer" data-view="archive" type="button"></button>
        <button class="drawer only-compact" data-view="drawers" type="button"></button>
      </div>
      <div class="rail-drawers only-wide">
        <h2 class="rail-caption">Cassetti</h2>
        <ul id="drawer-list"></ul>
        <form id="new-drawer" class="new-drawer">
          <input name="name" placeholder="Nuovo cassetto" aria-label="Nome del nuovo cassetto" maxlength="80" autocomplete="off">
          <button type="submit" class="icon-btn" aria-label="Crea cassetto"></button>
        </form>
      </div>
      <footer class="rail-foot only-wide">
        <span id="user-email"></span>
        <a href="/cdn-cgi/access/logout" id="logout">Esci</a>
      </footer>
    </nav>

    <header class="searchbar">
      <form id="place-search" class="place-search" role="search">
        <input id="place-input" type="search" placeholder="Cerca un luogo o incolla coordinate"
          aria-label="Luogo o coordinate" autocomplete="off" spellcheck="false"
          aria-controls="place-results" aria-expanded="false" aria-autocomplete="list">
        <ul id="place-results" class="place-results" role="listbox" hidden></ul>
      </form>
      <button id="gps" class="btn btn-steel" type="button"><span class="gps-label">La mia posizione</span></button>
      <div class="radius" role="group" aria-label="Raggio di ricerca" id="radii"></div>
    </header>

    <div class="map-wrap">
      <div id="map" aria-label="Mappa"></div>
    </div>

    <section class="panel" id="panel">
      <div class="sheet-handle only-compact" id="sheet-handle" role="button" tabindex="0"
        aria-label="Allarga o riduci l’elenco"><span></span></div>
      <div id="panel-body" aria-live="polite"></div>
    </section>
  </div>

  <div id="menu" class="menu" popover></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="print-root" class="print-root"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js?v=20261020b"></script>
</body>
</html>
